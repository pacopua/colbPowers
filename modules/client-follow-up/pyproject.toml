[project]
name = "meeting-summarizer"
version = "0.1.0"
description = "Meeting transcription to Word document summarizer"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "streamlit>=1.40.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
